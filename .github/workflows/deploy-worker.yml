name: Deploy Worker
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smail-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ ! -f package-lock.json ]; then npm install --package-lock-only --ignore-scripts; fi
          npm ci
      - uses: actions/upload-artifact@v4
        with:
          name: worker-lockfile
          path: worker/package-lock.json
      - run: npm run typecheck
      - run: npm test
      - name: Validate required authentication secrets
        env:
          OWNER_KEY_HASH: ${{ secrets.OWNER_KEY_HASH }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          set -e
          [[ "$OWNER_KEY_HASH" =~ ^[a-f0-9]{64}$ ]]
          [[ "$JWT_SECRET" =~ ^[a-f0-9]{64}$ ]]
          test "$OWNER_EMAIL" = "contact@slickk.online"
          echo "PASS: Required secret formats validated"
      - name: Deploy Worker and secrets together
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_KEY_HASH: ${{ secrets.OWNER_KEY_HASH }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          set -euo pipefail
          umask 077
          SECRET_FILE="$(mktemp)"
          trap 'rm -f "$SECRET_FILE"' EXIT
          export SECRET_FILE
          python3 -c 'import os,json; keys=("OWNER_KEY_HASH","JWT_SECRET","OWNER_EMAIL"); json.dump({k:os.environ[k] for k in keys},open(os.environ["SECRET_FILE"],"w"))'
          npx --no-install wrangler deploy --help > /tmp/smail-deploy-help.txt
          grep -q -- "--secrets-file" /tmp/smail-deploy-help.txt
          npx --no-install wrangler deploy --secrets-file "$SECRET_FILE"
          echo "PASS: Worker deployed with authentication secrets"
      - name: Verify public HTTPS health
        run: |
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 15 https://api.slickk.online/health -o /tmp/smail-health.json && jq -e '. == {"ok":true}' /tmp/smail-health.json; then exit 0; fi
            sleep 10
          done
          exit 1
