name: Remediate SMAIL Dependencies

on:
  push:
    branches:
      - milestone-2-auth-schema
    paths:
      - .github/workflows/remediate-dependencies.yml

permissions:
  contents: read

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate consistent dependency tree
        run: |
          npm pkg set dependencies.hono=4.13.22
          npm pkg set devDependencies.wrangler=4.168.0

          VITEST_VERSION=$(npm view vitest version)
          WORKERS_VERSION=$(npm view @cloudflare/workers-types version)
          NODE_TYPES_VERSION=$(npm view @types/node@22 version --json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const v=JSON.parse(s);console.log(Array.isArray(v)?v.at(-1):v)})')

          npm pkg set "devDependencies.vitest=$VITEST_VERSION"
          npm pkg set "devDependencies.@cloudflare/workers-types=$WORKERS_VERSION"
          npm pkg set "devDependencies.@types/node=$NODE_TYPES_VERSION"

          rm -rf node_modules
          rm -f package-lock.json

          npm install --package-lock-only
          cat package.json

      - name: Verify reproducible installation
        run: npm ci

      - name: Inspect resolved versions
        run: |
          node --version
          npm ls --depth=0
          npm ls workerd
          npx wrangler --version
          cat package.json

      - name: Production security audit
        run: npm audit --omit=dev

      - name: Complete security audit
        if: always()
        run: npm audit

      - name: TypeScript validation
        if: always()
        run: npm run typecheck

      - name: Worker unit tests
        if: always()
        run: npm test

      - name: Upload candidate dependency files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smail-remediated-dependencies
          path: |
            worker/package.json
            worker/package-lock.json
          if-no-files-found: error
          retention-days: 7
