name: Test SMAIL Authentication API

on:
  push:
    branches:
      - milestone-2-auth-schema
    paths:
      - 'worker/package.json'
      - 'worker/package-lock.json'
      - 'worker/src/**'
      - 'worker/migrations/**'
      - 'worker/test/runtime/**'
      - '.github/workflows/test-auth-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: Apply isolated migrations
        run: |
          npx wrangler d1 migrations apply \
            smail-auth-test-db \
            --local \
            --config test/runtime/auth-wrangler.toml \
            --persist-to /tmp/smail-auth-d1

      - name: Test authentication endpoints
        run: |
          set -e

          npx wrangler dev \
            --local \
            --config test/runtime/auth-wrangler.toml \
            --persist-to /tmp/smail-auth-d1 \
            --ip 127.0.0.1 \
            --port 8790 \
            > /tmp/smail-auth.log 2>&1 &

          PID=$!

          trap 'kill "$PID" 2>/dev/null || true; cat /tmp/smail-auth.log' EXIT

          for attempt in $(seq 1 30); do

            if curl -s --max-time 60 \
              http://127.0.0.1:8790/ \
              -o /tmp/smail-auth-result.json; then

              cat /tmp/smail-auth-result.json

              python3 -c 'import json; d=json.load(open("/tmp/smail-auth-result.json")); assert d["ok"] is True, d; assert d["passed"] == d["total"] == 43, d'

              exit 0
            fi

            sleep 2

          done

          exit 1
