name: Test SMAIL Session Runtime

on:
  push:
    branches:
      - milestone-2-auth-schema
    paths:
      - 'worker/src/services/**'
      - 'worker/migrations/**'
      - 'worker/test/runtime/**'
      - '.github/workflows/test-session-runtime.yml'

permissions:
  contents: read

jobs:
  session-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Apply isolated local migrations
        run: |
          npx wrangler d1 migrations apply \
            smail-session-test-db \
            --local \
            --config test/runtime/session-wrangler.toml \
            --persist-to /tmp/smail-session-d1

      - name: Test actual session service
        run: |
          set -e

          npx wrangler dev \
            --local \
            --config test/runtime/session-wrangler.toml \
            --persist-to /tmp/smail-session-d1 \
            --ip 127.0.0.1 \
            --port 8788 \
            > /tmp/smail-session.log 2>&1 &

          PID=$!

          trap 'kill "$PID" 2>/dev/null || true; cat /tmp/smail-session.log' EXIT

          for attempt in $(seq 1 30); do

            if curl -s \
              http://127.0.0.1:8788/ \
              -o /tmp/smail-session-result.json; then

              cat /tmp/smail-session-result.json

              python3 -c 'import json; d=json.load(open("/tmp/smail-session-result.json")); assert d["ok"] is True, d; assert d["passed"] == d["total"] == 13, d'

              exit 0
            fi

            sleep 2
          done

          exit 1
