name: Test Hosted Sanitizer

on:
  push:
    branches:
      - milestone-3-inbound-email
    paths:
      - 'worker/test/sanitize-hosted/**'
      - '.github/workflows/test-sanitize-hosted.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smail-hosted-sanitizer
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROBE_NAME: smail-sanitize-${{ github.run_id }}-${{ github.run_attempt }}

    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install locked dependencies
        run: npm ci

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Deploy isolated authenticated probe
        id: deploy
        run: |
          set -euo pipefail
          umask 077

          PROBE_KEY=$(openssl rand -hex 32)

          echo "::add-mask::$PROBE_KEY"

          echo "PROBE_KEY=$PROBE_KEY" >> "$GITHUB_ENV"

          SECRET_FILE=$(mktemp)

          trap 'rm -f "$SECRET_FILE"' EXIT

          export PROBE_KEY SECRET_FILE

          python3 -c 'import os,json; json.dump({"PROBE_KEY":os.environ["PROBE_KEY"]},open(os.environ["SECRET_FILE"],"w"))'

          npx --no-install wrangler deploy \
            --config test/sanitize-hosted/wrangler.toml \
            --name "$PROBE_NAME" \
            --secrets-file "$SECRET_FILE" \
            2>&1 | tee /tmp/sanitize-deploy.log

          URL=$(grep -oE "https://${PROBE_NAME}\.[a-zA-Z0-9.-]+\.workers\.dev" /tmp/sanitize-deploy.log | head -1)

          test -n "$URL"

          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify hosted sanitizer
        env:
          PROBE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          umask 077

          HEADER_FILE=$(mktemp)

          trap 'rm -f "$HEADER_FILE"' EXIT

          printf 'Authorization: Bearer %s\n' "$PROBE_KEY" > "$HEADER_FILE"

          sleep 15

          STATUS=$(curl -sS --max-time 30 \
            -X POST \
            -o /tmp/unauthorized.txt \
            -w '%{http_code}' \
            "$PROBE_URL/basic")

          test "$STATUS" = "401"

          echo "PASS: Unauthorized requests rejected"

          echo "=== WAIT FOR AUTHENTICATED HOSTED READINESS ==="

          READY=0

          for ATTEMPT in $(seq 1 20); do

            STATUS=$(curl -sS --max-time 15 \
              -X POST \
              -H @"$HEADER_FILE" \
              -o /tmp/sanitize-ready.json \
              -w '%{http_code}' \
              "$PROBE_URL/basic") || STATUS=000

            echo "READINESS_ATTEMPT=$ATTEMPT HTTP_STATUS=$STATUS"

            if [ "$STATUS" = "200" ] && \
              jq -e '.ok == true and .test == "/basic"' \
                /tmp/sanitize-ready.json >/dev/null; then

              READY=1
              break

            fi

            if [ "$STATUS" = "404" ] && \
              grep -q 'error code: 1042' /tmp/sanitize-ready.json; then
              sleep 3
              continue
            fi

            if [ "$STATUS" = "000" ]; then
              sleep 3
              continue
            fi

            cat /tmp/sanitize-ready.json || true
            echo "FAIL: Unexpected readiness response"
            exit 1

          done

          test "$READY" = "1"

          echo "PASS: Authenticated hosted readiness"

          PASSED=0
          FAILED=0

          for TEST in basic unicode script encoded-url tracking hidden-image normal-image malformed nesting large-body expansion idempotence; do

            for ATTEMPT in $(seq 1 5); do

              rm -f /tmp/sanitize-result.json

              STATUS=$(curl -sS --max-time 30 \
                -X POST \
                -H @"$HEADER_FILE" \
                -o /tmp/sanitize-result.json \
                -w '%{http_code}' \
                "$PROBE_URL/$TEST") || STATUS=000

              if [ "$STATUS" = "404" ] && \
                grep -q 'error code: 1042' /tmp/sanitize-result.json; then

                echo "RETRY: $TEST attempt=$ATTEMPT Cloudflare 1042"

                sleep 3
                continue

              fi

              break

            done

            echo "TEST=$TEST HTTP_STATUS=$STATUS"

            cat /tmp/sanitize-result.json || true
            echo

            if [ "$STATUS" = "200" ] && \
              jq -e '.ok == true' /tmp/sanitize-result.json >/dev/null; then

              echo "PASS: $TEST"
              PASSED=$((PASSED + 1))

            else

              echo "FAIL: $TEST"
              FAILED=$((FAILED + 1))

            fi

          done

          echo "HOSTED_SANITIZER_PASSED=$PASSED"
          echo "HOSTED_SANITIZER_FAILED=$FAILED"

          test "$PASSED" = "12"
          test "$FAILED" = "0"

      - name: Delete temporary Worker
        if: always() && steps.deploy.outcome != 'skipped'
        run: |
          set -euo pipefail

          curl -fsS --max-time 30 \
            -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PROBE_NAME" \
            -o /tmp/sanitize-delete.json

          jq -e '.success == true' \
            /tmp/sanitize-delete.json

          echo "PASS: Temporary Worker deleted"

      - name: Verify original production health
        if: always()
        run: |
          set -euo pipefail

          RESULT=$(curl -fsS --max-time 30 \
            https://api.slickk.online/health)

          test "$RESULT" = '{"ok":true}'

          echo "PASS: Original production health"
