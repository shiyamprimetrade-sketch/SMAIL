name: Test Spam Runtime

on:
  push:
    branches:
      - milestone-3-inbound-email
    paths:
      - 'worker/**'
      - '.github/workflows/test-spam-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Verify spam classification runtime
        run: |
          set -euo pipefail

          STATE=$(mktemp -d)
          PID=""

          cleanup() {
            if [ -n "$PID" ]; then
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
            fi

            rm -rf "$STATE"
          }

          trap cleanup EXIT

          npx --no-install wrangler d1 migrations apply \
            smail-spam-test \
            --local \
            --config test/runtime/spam-wrangler.toml \
            --persist-to "$STATE"

          npx --no-install wrangler dev \
            --local \
            --config test/runtime/spam-wrangler.toml \
            --persist-to "$STATE" \
            --ip 127.0.0.1 \
            --port 8794 \
            > /tmp/spam-runtime.log 2>&1 &

          PID=$!

          READY=0

          for i in $(seq 1 60); do
            if grep -q "Ready on" /tmp/spam-runtime.log; then
              READY=1
              break
            fi

            sleep 1
          done

          test "$READY" = "1"

          STATUS=$(curl -sS \
            --max-time 60 \
            -o /tmp/spam-result.json \
            -w '%{http_code}' \
            http://127.0.0.1:8794/)

          cat /tmp/spam-result.json
          echo

          test "$STATUS" = "200"

          python3 - <<'PY'
          import json

          with open("/tmp/spam-result.json") as f:
              result = json.load(f)

          assert result["ok"] is True
          assert result["passed"] == 22
          assert result["total"] == 22

          for name, passed in result["checks"].items():
              assert passed, name
              print("PASS:", name)

          print("SPAM_RUNTIME_PASSED=22")
          print("SPAM_RUNTIME_FAILED=0")
          PY

      - name: Runtime diagnostics
        if: failure()
        run: |
          cat /tmp/spam-runtime.log || true
          cat /tmp/spam-result.json || true
