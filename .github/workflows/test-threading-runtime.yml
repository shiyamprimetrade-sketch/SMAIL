name: Test Threading Runtime

on:
  push:
    branches:
      - milestone-3-inbound-email
    paths:
      - 'worker/**'
      - '.github/workflows/test-threading-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Initialize isolated local D1
        run: |
          npx --no-install wrangler d1 migrations apply \
            smail-threading-test \
            --local \
            --config test/runtime/threading-wrangler.toml

      - name: Verify actual D1 threading services
        run: |
          set -euo pipefail

          npx --no-install wrangler dev \
            --local \
            --config test/runtime/threading-wrangler.toml \
            --ip 127.0.0.1 \
            --port 8793 \
            > /tmp/threading-runtime.log 2>&1 &

          PID=$!

          trap 'kill "$PID" 2>/dev/null || true' EXIT

          READY=0

          for i in $(seq 1 60); do
            if grep -q "Ready on" /tmp/threading-runtime.log; then
              READY=1
              break
            fi

            sleep 1
          done

          if [ "$READY" != "1" ]; then
            cat /tmp/threading-runtime.log
            exit 1
          fi

          STATUS=$(curl -sS \
            --max-time 60 \
            -o /tmp/threading-result.json \
            -w '%{http_code}' \
            http://127.0.0.1:8793/)

          cat /tmp/threading-result.json
          echo

          test "$STATUS" = "200"

          python3 - <<'PY'
          import json

          with open("/tmp/threading-result.json") as f:
              result = json.load(f)

          assert result["ok"] is True
          assert result["passed"] == 20
          assert result["total"] == 20

          for name, passed in result["checks"].items():
              assert passed, name
              print("PASS:", name)

          print("THREADING_RUNTIME_PASSED=20")
          print("THREADING_RUNTIME_FAILED=0")
          PY

      - name: Runtime diagnostics
        if: failure()
        run: |
          cat /tmp/threading-runtime.log || true
          cat /tmp/threading-result.json || true
