name: Test SMAIL Login Rate Limiter

on:
  push:
    branches:
      - milestone-2-auth-schema
    paths:
      - 'worker/src/middleware/**'
      - 'worker/migrations/**'
      - 'worker/test/runtime/**'
      - '.github/workflows/test-rate-limit.yml'

permissions:
  contents: read

jobs:
  rate-limit-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Apply isolated migrations
        run: |
          npx wrangler d1 migrations apply \
            smail-rate-limit-test-db \
            --local \
            --config test/runtime/rate-limit-wrangler.toml \
            --persist-to /tmp/smail-rate-limit-d1

      - name: Verify rate limiter
        run: |
          set -e

          npx wrangler dev \
            --local \
            --config test/runtime/rate-limit-wrangler.toml \
            --persist-to /tmp/smail-rate-limit-d1 \
            --ip 127.0.0.1 \
            --port 8789 \
            > /tmp/smail-rate-limit.log 2>&1 &

          PID=$!

          trap 'kill "$PID" 2>/dev/null || true; cat /tmp/smail-rate-limit.log' EXIT

          for attempt in $(seq 1 30); do

            if curl -s \
              --max-time 30 \
              http://127.0.0.1:8789/ \
              -o /tmp/smail-rate-limit-result.json; then

              cat /tmp/smail-rate-limit-result.json

              python3 -c 'import json; d=json.load(open("/tmp/smail-rate-limit-result.json")); assert d["ok"] is True, d; assert d["passed"] == d["total"] == 11, d'

              exit 0
            fi

            sleep 2
          done

          exit 1
