name: Migrate D1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smail-d1-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/milestone-2-auth-schema'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Inspect pending migrations
        run: npx wrangler d1 migrations list smail-db --remote

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply smail-db --remote

      - name: Verify migration history
        run: npx wrangler d1 migrations list smail-db --remote

      - name: Inspect database schema
        run: |
          npx wrangler d1 execute smail-db --remote \
          --command "SELECT name,type FROM sqlite_master ORDER BY type,name;"
